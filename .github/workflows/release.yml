name: Release paper.jar

on:
  push:
    branches:
      - main     # main ブランチに push されたら自動実行
    tags:
      - 'v*'     # v1.0 などのタグが打たれた時も実行

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply patches and build paperclip JAR
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          ./gradlew --no-daemon --max-workers=1 applyPatches createPaperclipJar -PvineflowerHeapSize=4G --stacktrace

      - name: Prepare release artifact
        run: |
          mkdir -p release-artifacts
          jar=$(ls paper-server/build/libs/paper-paperclip-*.jar | head -n1)
          if [ -n "$jar" ]; then
            cp -f "$jar" release-artifacts/paper.jar
          else
            echo "No paper-paperclip jar found"
            ls paper-server/build/libs || true
            exit 1
          fi
          ls -la release-artifacts

      - name: Create GitHub Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          # mainにPushされた時は 'latest' リリースを上書き更新し、タグ時はそのタグ名で作成
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Latest Auto Build' }}
          files: release-artifacts/paper.jar
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}