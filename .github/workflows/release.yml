name: Release paper.jar

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply patches
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          ./gradlew applyPatches --stacktrace --no-daemon

      - name: Build paperclip JAR
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon

      - name: Prepare release artifact
        run: |
          mkdir -p release-artifacts
          jar=$(ls paper-server/build/libs/paper-paperclip-*.jar | head -n1)
          if [ -n "$jar" ]; then
            cp -f "$jar" release-artifacts/paper.jar
          else
            echo "No paper-paperclip jar found"
            ls paper-server/build/libs || true
            exit 1
          fi
          ls -la release-artifacts

      - name: Create GitHub Release and upload artifact
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          name: Release ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          draft: false
          artifacts: release-artifacts/paper.jar
