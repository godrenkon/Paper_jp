name: Build and release JAR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build (assemble jars)
        run: ./gradlew assemble -x test --no-daemon

      - name: Collect JAR artifacts
        run: |
          mkdir -p release-artifacts
          find . -type f -path "*/build/libs/*.jar" -exec cp -u {} release-artifacts/ \;
          ls -la release-artifacts || true

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: release-artifacts/*.jar
name: Release Paper

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply patches
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          ./gradlew applyPatches --stacktrace

      - name: Build paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Upload release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: paper-server/build/libs/paper-paperclip-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
